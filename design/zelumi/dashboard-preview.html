].map((r,id)=>({id,name:r[0],category:r[1],amount:r[2],type:r[3],icon:r[4],day:r[5],part:r[6],parts:r[7],total:r[8]}));
const params=new URLSearchParams(location.search);
const requestedPage=params.get('page');let previewPage=['login','profile','overview','history'].includes(requestedPage)?requestedPage:'login';
const months=['Outubro','Novembro','Dezembro'];let current=1,view=params.get('view')||preferredColor(),phone=false,all=previewPage==='history';
let filters={q:params.get('q')||'',period:'all',type:'all',category:'all',parts:'all'},filtersOpen=true,page=0;
const groups={Casa:'#BD6745',Alimentação:'#C6A16B',Compras:'#78978A',Transporte:'#7B93A3',Saúde:'#A79888'};
function data(month=current){if(month===1)return samples;if(month===0)return samples.filter(r=>!r.part||r.part>1).map(r=>({...r,part:r.part?r.part-1:undefined,day:Math.min(r.day+20,28)}));return samples.filter(r=>r.part).map(r=>({...r,part:r.part+1,amount:r.name==='Google'?8333:r.amount,day:1}));}
const normalizeName=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const escapeAttr=s=>s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function matchingRows(){return [0,1,2].flatMap(month=>data(month).map(r=>({...r,month}))).filter(r=>(filters.period==='all'||r.month===Number(filters.period))&&(filters.type==='all'||r.type===filters.type)&&(filters.category==='all'||r.category===filters.category)&&(filters.parts==='all'||Boolean(r.part)===(filters.parts==='yes'))&&normalizeName(r.name).includes(normalizeName(filters.q))).sort((a,b)=>b.month-a.month||b.day-a.day||b.id-a.id);}
function filterSelect(key,label,options){return `<label>${label}<select data-filter="${key}" aria-label="${label}">${options.map(([value,text])=>`<option value="${value}" ${filters[key]===value?'selected':''}>${text}</option>`).join('')}</select></label>`;}
function searchPanel(){const selected=Object.entries(filters).filter(([key,value])=>key!=='q'&&value!=='all').length,results=matchingRows();return `<section class="search-panel" aria-label="Busca e filtros"><div class="search-main"><label class="search-field">${icon('search',18)}<input class="purchase-search" aria-label="Buscar pelo nome da compra ou receita" placeholder="Busque pelo nome: Google, mercado, Uber…" value="${escapeAttr(filters.q)}">${filters.q?'<button data-clear-search aria-label="Limpar busca">×</button>':''}</label><button class="filter-toggle" data-toggle-filters aria-expanded="${filtersOpen}">Filtros${selected?' · '+selected:''}</button></div><p class="search-hint">Comece pelo nome da compra. ${filters.period==='all'?'A busca inclui todos os meses da demonstração.':'A busca está limitada ao mês selecionado.'}</p>${filtersOpen?`<div class="filters-row">${filterSelect('period','Período',[['all','Todos os meses'],...months.map((m,i)=>[String(i),m+' 2026'])])}${filterSelect('type','Tipo',[['all','Receitas e despesas'],['expense','Despesas'],['income','Receitas']])}${filterSelect('category','Categoria',[['all','Todas as categorias'],...Object.keys(groups).map(c=>[c,c]),['Receitas','Receitas']])}${filterSelect('parts','Parcelamento',[['all','Todos os lançamentos'],['yes','Parcelados'],['no','Não parcelados']])}<button class="reset-filters" data-reset-filters>Limpar filtros</button></div>`:''}<div class="search-count" aria-live="polite"><span><strong>${results.length} ${results.length===1?'resultado encontrado':'resultados encontrados'}</strong></span><span>Cada parcela no seu respectivo mês.</span></div></section>`;}
function row(r){return `<button class="transaction" data-record="${r.month??current}:${r.id}"><span class="transaction-icon ${r.type==='income'?'income':''}">${icon(r.icon)}</span><span class="transaction-info"><span class="transaction-name">${r.name}</span><span class="transaction-details">${r.category}${r.part?`<span class="installment">${r.part}/${r.parts}</span>`:''}</span></span><span class="transaction-value"><strong class="${r.type==='income'?'income':''}">${r.type==='income'?'+':'−'} ${currency(r.amount)}</strong><small>${String(r.day).padStart(2,'0')} ${['out','nov','dez'][r.month??current]}</small></span></button>`}
function app(theme){const rows=data(),income=rows.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0),expense=rows.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0),parts=rows.filter(r=>r.part).reduce((s,r)=>s+r.amount,0),categories=Object.entries(groups).map(([name,color])=>({name,color,amount:rows.filter(r=>r.category===name&&r.type==='expense').reduce((s,r)=>s+r.amount,0)})).filter(r=>r.amount).sort((a,b)=>b.amount-a.amount);let stop=0;const gradient=categories.map(r=>{const begin=stop;stop+=r.amount/expense*100;return `${r.color} ${begin}% ${stop}%`}).join(',');const results=all?matchingRows():rows;page=Math.min(page,Math.max(0,Math.ceil(results.length/8)-1));const visible=all?results.slice(page*8,page*8+8):rows.slice(0,6);
return `<div class="dashboard ${all?'history':''}" data-theme="${theme}"><aside class="sidebar"><img class="brand" src="./conceitos/02-conversa-${theme}.svg" alt="Zelumi"><p class="nav-label">SEU ESPAÇO</p><nav class="nav" aria-label="Navegação"><button data-nav="overview" class="${!all?'active':''}">${icon('grid')}Visão geral</button><button data-nav="history" class="${all?'active':''}">${icon('list')}Lançamentos</button><button data-nav="profile">${icon('user')}Perfil</button></nav><div class="sidebar-bottom"><div class="telegram-box"><div class="small-icon">${icon('send',19)}</div><strong>Uma mensagem resolve.</strong><p>Registre pelo Telegram.<br>Acompanhe por aqui.</p></div><div class="profile"><div class="avatar">VC</div><div><strong>Sua conta</strong><small>Conta de demonstração</small></div></div></div></aside><section class="main"><header class="topbar"><div class="breadcrumb">Meu espaço <span>/</span><strong>${all?'Lançamentos':'Visão geral'}</strong></div><img class="brand mobile-logo" src="./conceitos/02-conversa-${theme}.svg" alt="Zelumi"><div class="topbar-right"><button class="icon-button theme-toggle" aria-label="Alternar tema">${icon(theme==='light'?'moon':'sun',15)}</button><button class="avatar profile-header-button" data-nav="profile" aria-label="Abrir perfil">VC</button></div></header><div class="content"><div class="page-header"><div><p class="eyebrow">SEU DINHEIRO, COM CLAREZA</p><h1>${all?'Lançamentos':'Visão geral'}</h1><p>${all?'Encontre uma compra sem precisar lembrar a data.':`Receitas, despesas e parcelas de ${months[current].toLowerCase()}.`}</p></div><div class="month-control"><button data-month="-1" aria-label="Mês anterior" ${current===0?'disabled':''}>${icon('chevronLeft',14)}</button><span class="month">${icon('calendar',14)}${months[current]} 2026</span><button data-month="1" aria-label="Próximo mês" ${current===2?'disabled':''}>${icon('chevronRight',14)}</button></div></div>${all?searchPanel():''}<div class="kpis"><article class="kpi"><div class="kpi-title"><span class="kpi-icon">${icon('arrowIn',14)}</span>Receitas do mês</div><strong>${currency(income)}</strong><div class="kpi-foot">${current===2?'Nenhuma receita cadastrada para este mês.':'Soma das entradas registradas no período.'}</div></article><article class="kpi expenses"><div class="kpi-title"><span class="kpi-icon">${icon('arrowOut',14)}</span>Despesas do mês</div><strong>${currency(expense)}</strong><div class="kpi-foot">${currency(parts)} em parcelas · ${currency(expense-parts)} à vista</div></article><article class="kpi result"><div class="kpi-title"><span class="kpi-icon">${icon('wallet',14)}</span>Resultado do mês</div><strong>${currency(income-expense)}</strong><div class="kpi-foot">Receitas menos despesas deste mês.</div></article></div><div class="middle"><section class="panel categories"><div class="panel-heading"><h2 class="grid-title">Para onde foi seu dinheiro</h2></div><p class="panel-subtitle">Despesas por categoria neste mês.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${gradient||'var(--border) 0% 100%'})" role="img" aria-label="Distribuição de despesas por categoria"><div class="donut-label"><span>Total de despesas</span><strong>${currency(expense)}</strong></div></div></div><div class="legend">${categories.map(r=>`<div class="legend-row"><span class="legend-dot" style="background:${r.color}"></span><span class="legend-name">${r.name}</span><span class="legend-amount">${currency(r.amount)}</span><span class="legend-percent">${Math.round(r.amount/expense*100)}%</span></div>`).join('')}</div></section><section class="panel transactions"><div class="panel-heading"><h2 class="grid-title">${all?'Todos os lançamentos':'Últimos lançamentos'}</h2><button class="plain-button" data-nav="${all?'overview':'history'}">${all?'Voltar ao resumo':'Ver todos'} ${icon('chevronRight',12)}</button></div><p class="panel-subtitle">${all?'Clique em um registro para consultar os detalhes.':'Os movimentos que compõem seu mês.'}</p><div class="table-wrap">${visible.length?visible.map(row).join(''):'<div class="no-results"><strong>Nenhum lançamento encontrado.</strong>Tente outro nome ou amplie os filtros.</div>'}</div><div class="table-note"><span>${all?(results.length?page*8+1:0)+'–'+Math.min((page+1)*8,results.length):visible.length} de ${results.length} lançamentos</span>${all?`<span class="pagination"><button data-page="-1" aria-label="Página anterior" ${page===0?'disabled':''}>${icon('chevronLeft',12)}</button><span>${page+1} / ${Math.max(1,Math.ceil(results.length/8))}</span><button data-page="1" aria-label="Próxima página" ${(page+1)*8>=results.length?'disabled':''}>${icon('chevronRight',12)}</button></span>`:'<span>Valores referentes ao mês</span>'}</div></section></div><div class="bottom-note">${icon('info',15)}<span>Compra parcelada? Aqui entra só a parcela deste mês. O valor total continua nos detalhes.</span></div><footer class="footer"><span>Menos esforço para acompanhar suas finanças.</span><span>zelumi · no seu ritmo</span></footer></div></section></div>`;}
function render(){document.querySelector('[data-preview-screen]').value=previewPage;document.body.className=(view==='compare'?'compare':'single')+(phone?' phone':'');document.getElementById('previews').innerHTML=['light','dark'].map((theme,i)=>`<section class="preview-shell" ${view!=='compare'&&i===1?'aria-hidden="true"':''}><div class="preview-label">${theme==='light'?'Tema claro':'Tema escuro'}</div><div class="canvas">${previewScreen(view==='compare'?theme:view)}</div></section>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));resize();}
function resize(){document.querySelectorAll('.canvas').forEach(c=>{if(view==='compare'){const s=c.clientWidth/1240;c.style.setProperty('--scale',s);c.style.height=(c.firstElementChild.offsetHeight*s)+'px';}else{c.style.height='';c.style.removeProperty('--scale');}})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(accountAction(b))return;if(b.hasAttribute('data-toggle-filters')){filtersOpen=!filtersOpen;render();}else if(b.hasAttribute('data-clear-search')){filters.q='';page=0;render();document.querySelector('.purchase-search')?.focus();}else if(b.hasAttribute('data-reset-filters')){filters={q:'',period:'all',type:'all',category:'all',parts:'all'};page=0;render();}else if(b.dataset.page){page+=Number(b.dataset.page);render();}else if(b.dataset.view){view=b.dataset.view;phone=false;render();}else if(b.classList.contains('theme-toggle')){view=view==='dark'?'light':'dark';preferredTheme=view;try{localStorage.setItem('zelumi-preview-color-mode',preferredTheme);}catch{}render();}else if(b.classList.contains('phone-control')){phone=!phone;if(view==='compare')view='light';render();}else if(b.dataset.month){current+=Number(b.dataset.month);render();}else if(b.dataset.nav==='overview'||b.dataset.nav==='history'){changeScreen(b.dataset.nav);}else if(b.dataset.nav==='profile'){document.getElementById('dialog-content').innerHTML='<h2>Seu espaço no Zelumi</h2><p>O acesso será feito pela sua conta Telegram, sem uma senha separada.</p><p class="demo-info">Nesta prévia, estamos usando uma conta e lançamentos de demonstração.</p>';document.getElementById('details').showModal();}else if(b.dataset.record!==undefined){const [month,id]=b.dataset.record.split(':').map(Number);const r=data(month).find(r=>r.id===id);document.getElementById('dialog-content').innerHTML=`<p class="eyebrow">DETALHES DO LANÇAMENTO</p><h2>${r.name}</h2><p class="dialog-value">${currency(r.amount)}</p><dl><dt>Categoria</dt><dd>${r.category}</dd><dt>Mês</dt><dd>${months[month]} 2026</dd>${r.part?`<dt>Parcela</dt><dd>${r.part} de ${r.parts}</dd><dt>Total da compra</dt><dd>${currency(r.total)}</dd>`:`<dt>Tipo</dt><dd>${r.type==='income'?'Receita':'Despesa à vista'}</dd>`}</dl><p class="demo-info">Dados fictícios para avaliar a apresentação. Nenhum lançamento real é alterado.</p>`;document.getElementById('details').showModal();}else if(b.classList.contains('close'))document.getElementById('details').close();});
document.addEventListener('input',e=>{if(!e.target.classList.contains('purchase-search'))return;const index=[...document.querySelectorAll('.purchase-search')].indexOf(e.target),position=e.target.selectionStart;filters.q=e.target.value;page=0;render();const next=document.querySelectorAll('.purchase-search')[index];next?.focus();next?.setSelectionRange(position,position);});
document.addEventListener('change',e=>{if(!e.target.dataset.filter)return;filters[e.target.dataset.filter]=e.target.value;page=0;render();});
document.getElementById('details').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
render();window.addEventListener('resize',resize);document.fonts.ready.then(resize);
</script>
</body></html>
